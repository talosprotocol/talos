name: Sites CI
permissions: read-all

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  marketing-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd site/marketing
          npm install

      - name: Type check
        continue-on-error: true
        run: |
          cd site/marketing
          npm run typecheck || echo "Typecheck skipped or completed with errors"

      - name: Lint
        continue-on-error: true
        run: |
          cd site/marketing
          npm run lint || echo "Linting skipped or completed with errors"

      - name: Build
        run: |
          cd site/marketing
          npm run build
